services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mern-backend
    ports:
      - "8082:8080"
    environment:
      PORT: 8080
      MONGODB_URL: mongodb://mongodb:27017/mern
      ACCESS_TOKEN_SECRET: itissecret
      REFRESH_TOKEN_SECRET: itisalsosecret
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: mern-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    stdin_open: true
    tty: true

  mongodb:
    image: mongo:7
    container_name: mern-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: